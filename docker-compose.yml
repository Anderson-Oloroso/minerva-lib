version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: minerva_mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:${DB_PORT:-3306}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/script/:/docker-entrypoint-initdb.d/

  backend:
    build: ./backend
    container_name: minerva_backend
    restart: always
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  mysql_data: