version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: minerva_mysql
    restart: always
    environment:
      MYSQL_DATABASE: minerva_lib_db
      MYSQL_ROOT_PASSWORD: secretpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/script/:/docker-entrypoint-initdb.d/

  backend:
    build: ./backend
    container_name: minerva_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

volumes:
  mysql_data: